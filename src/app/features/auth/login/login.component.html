<div class="login-page">

  <div class="login-side-map">
    <div class="map-overlay"></div>
    <img src="assets/img/experience/santagueda_mapa.png" alt="Mapa de Santagueda" class="map-bg-img">
    <div class="map-branding">
      <div class="map-logo">
        <img src="/assets/img/logo.png" alt="Logo Triada Cafetera" class="brand-logo-img">
        <span class="brand-name">Triada Cafetera</span>
      </div>
      <p class="map-tagline">Descubre el corazón del Eje Cafetero</p>
    </div>
  </div>

  <!-- Right Panel: Login Form -->
  <div class="login-side-form">
    <div class="form-wrapper">

      <div class="form-header">
        <h1>Bienvenido de vuelta</h1>
        <p class="form-subtitle">Ingresa tus datos para continuar</p>
      </div>

      <form class="auth-form">
        <div class="input-group">
          <label for="email">Correo electrónico</label>
          <div class="input-with-icon">
            <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2"
              fill="none">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <input
              id="email"
              type="email"
              placeholder="tucorreo@gmail.com"
              class="form-input"
              title="Ingresa tu correo electrónico"
              [appTooltip]="'Ingresa tu correo electrónico'"
            >
          </div>
        </div>

        <div class="input-group">
          <div class="label-row">
            <label for="password">Contraseña</label>
            <a
              href="#"
              class="forgot-link"
              title="Recuperar contraseña"
              [appTooltip]="'Recuperar contraseña'"
            >¿Olvidaste tu contraseña?</a>
          </div>
          <div class="input-with-icon">
            <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2"
              fill="none">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input
              id="password"
              type="password"
              placeholder="••••••••"
              class="form-input"
              title="Ingresa tu contraseña"
              [appTooltip]="'Ingresa tu contraseña'"
            >
          </div>
        </div>

        <button
          type="submit"
          class="btn-submit"
          title="Iniciar sesión"
          [appTooltip]="'Iniciar sesión'"
        >Iniciar Sesión</button>
      </form>

      <div class="divider">
        <span class="divider-line"></span>
        <span class="divider-text">o continúa con</span>
        <span class="divider-line"></span>
      </div>

      <div class="social-buttons">
        <button
          class="btn-social"
          type="button"
          title="Continuar con Google"
          [appTooltip]="'Continuar con Google'"
        >
          <svg class="social-icon" viewBox="0 0 48 48" width="20" height="20">
            <path fill="#4285F4"
              d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
            <path fill="#34A853"
              d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
            <path fill="#FBBC05"
              d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
            <path fill="#EA4335"
              d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
            <path fill="none" d="M0 0h48v48H0z" />
          </svg>
          Continuar con Google
        </button>
        <button
          class="btn-social btn-facebook"
          type="button"
          title="Continuar con Facebook"
          [appTooltip]="'Continuar con Facebook'"
        >
          <svg class="social-icon" viewBox="0 0 24 24" width="20" height="20" fill="#1877F2">
            <path
              d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
          </svg>
          Continuar con Facebook
        </button>
      </div>

      <p class="register-cta">
        ¿No tienes una cuenta?
        <a
          routerLink="/auth/register"
          class="register-link"
          title="Ir a registro"
          [appTooltip]="'Ir a registro'"
        >Regístrate aquí</a>
      </p>
    </div>
  </div>
</div>
